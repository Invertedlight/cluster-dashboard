<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Homelab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">jameshomelab</a>
    <nav>
      <a href="/">Apps</a>
      <a href="/apps/new">Add</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% if flash %}
    <p class="flash" role="status">{{ flash }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
