{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in to edit</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% if not enabled %}
<p class="error" role="alert">Editing is disabled because the login is not configured.</p>
{% else %}
<form class="stack" method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <label>Authenticator code
    <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" autocomplete="one-time-code" required>
  </label>
  <div class="actions">
    <button class="btn primary" type="submit">Sign in</button>
    <a class="btn" href="/">Cancel</a>
  </div>
</form>
{% endif %}
{% endblock %}
